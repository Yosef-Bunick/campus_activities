name: E2E (phone)

# Playwright smoke test at a phone viewport: real API (SQLite, local dev
# sign-in) + the production frontend build. Runs when either side changes.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: frontend
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
