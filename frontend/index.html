<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Browser bar + first paint follow the system light/dark setting (no white flash). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1976d2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <style>html{background:#fff}@media (prefers-color-scheme: dark){html{background:#121212}}</style>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- iOS ignores manifest icons for the home screen (see unified's index.html). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
